name: Codex External Subagent Runtime CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/**"
      - "examples/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "README.zh-CN.md"
      - "MIGRATION.md"
  push:
    paths:
      - "scripts/**"
      - "docs/**"
      - "examples/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "README.zh-CN.md"
      - "MIGRATION.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py'
