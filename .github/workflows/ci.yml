name: Codex External Subagent Bridge

on:
  pull_request:
    paths:
      - "codex-external-subagent-bridge/**"
      - ".github/tests/codex-external-subagent-bridge/**"
      - ".github/workflows/codex-external-subagent-bridge.yml"
  push:
    paths:
      - "codex-external-subagent-bridge/**"
      - ".github/tests/codex-external-subagent-bridge/**"
      - ".github/workflows/codex-external-subagent-bridge.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q codex-external-subagent-bridge
      - name: Test
        run: python -m unittest discover -s .github/tests/codex-external-subagent-bridge -p 'test_*.py'
